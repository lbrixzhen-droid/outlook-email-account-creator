name: Microsoft Account Auto-Creator

on:
  workflow_dispatch:
    inputs:
      account_count:
        description: 'Number of accounts to create'
        required: true
        default: '2'

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install seleniumbase undetected-chromedriver

      - name: Run Account Creator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 email_creator_with_selenium_and_gemini_audio.py
          
